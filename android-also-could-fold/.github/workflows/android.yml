name: Fold7 APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PROJECT_DIR: .
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK, instrumentation APK and run lint
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain
      - name: Test engine and shell bootstrap; compile standalone DEX
        run: python3 tools/fold-system.py build
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      - name: Compile emulator bootstrap smoke test
        run: |
          mkdir -p build/smoke-classes build/smoke-dex
          javac -cp "$ANDROID_HOME/platforms/android-36/android.jar:build/system-backend/classes" \
            -d build/smoke-classes system/tests/device/ShellRuntimeSmokeTest.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 31 \
            --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output build/smoke-dex \
            build/system-backend/classes/dev/tommy/foldshell/system/*.class \
            build/smoke-classes/ShellRuntimeSmokeTest.class
      - name: Verify signature and prepare installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fold-Transition-0.4.19-fold7-android17.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fold7-installable-apk
          path: ${{ env.PROJECT_DIR }}/dist/*
          if-no-files-found: error
      - name: Prepare runtime test inputs
        run: |
          mkdir -p build/device-tests
          cp build/smoke-dex/classes.dex build/device-tests/shell-runtime-smoke.dex
          cp app/build/outputs/apk/debug/app-debug.apk build/device-tests/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/device-tests/
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-test-inputs
          path: ${{ env.PROJECT_DIR }}/build/device-tests/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  runtime-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: '36'
            sdk: '36'
            target: google_apis
          - image: '37.0'
            sdk: '37'
            target: google_apis_ps16k
          - image: '37.2-beta3'
            sdk: '37'
            target: google_apis_ps16k
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-test-inputs
          path: device-tests
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: ${{ matrix.image }}
          channel: canary
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: |
            adb unroot
            adb wait-for-device
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk | tr -d '\r' | tee runtime-api.log
            test "$(cat runtime-api.log)" = "${{ matrix.sdk }}"
            adb push device-tests/shell-runtime-smoke.dex /data/local/tmp/fold-runtime-smoke.dex
            adb shell 'CLASSPATH=/data/local/tmp/fold-runtime-smoke.dex app_process /system/bin ShellRuntimeSmokeTest legacy-keyguard' | tee legacy-keyguard.log
            adb shell 'CLASSPATH=/data/local/tmp/fold-runtime-smoke.dex app_process /system/bin ShellRuntimeSmokeTest' | tee bootstrap-smoke.log
            grep -q 'ShellRuntimeSmokeTest PASS sdk=${{ matrix.sdk }} .*modes=V1,V2' bootstrap-smoke.log
            adb install -r device-tests/app-debug.apk
            adb install -r device-tests/app-debug-androidTest.apk
            adb shell am instrument -w -r dev.tommy.foldshell.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.log
            grep -q 'OK (' instrumentation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-test-logs-${{ matrix.image }}
          path: |
            runtime-api.log
            legacy-keyguard.log
            bootstrap-smoke.log
            instrumentation.log
          if-no-files-found: ignore
